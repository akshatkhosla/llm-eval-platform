services:
  - type: web
    name: evalplatform-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: evalplatform-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 8000

databases:
  - name: evalplatform-db
    plan: free
    databaseName: evalplatform
